<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Labubu Official Store</title>

  <!-- ==================================================
       VWO SMARTCODE
       
       Sau khi tạo Experiment trên VWO,
       dán SmartCode của VWO vào đây.

       Hiện tại ĐỂ TRỐNG theo yêu cầu.
       ================================================== -->


  <style>

    /* ==================================================
       BASIC RESET
       ================================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Pretendard",
        "Noto Sans KR",
        sans-serif;

      background-color: #f6f6f6;
      color: #222;

      line-height: 1.5;
    }


    /* ==================================================
       HEADER
       ================================================== */

    header {
      width: 100%;
      height: 64px;

      background-color: #111;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 7%;

      color: #fff;
    }


    .logo {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1.5px;
    }


    .header-right {
      font-size: 13px;
      color: #ccc;
    }


    /* ==================================================
       MAIN CONTAINER
       ================================================== */

    main {
      max-width: 1100px;

      margin: 45px auto;

      padding: 0 20px;
    }


    .breadcrumb {
      margin-bottom: 20px;

      font-size: 13px;

      color: #888;
    }


    /* ==================================================
       PRODUCT CARD
       ================================================== */

    .product-card {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 50px;

      background-color: #fff;

      padding: 45px;

      border-radius: 18px;

      box-shadow:
        0 5px 25px rgba(0, 0, 0, 0.07);
    }


    /* ==================================================
       PRODUCT IMAGE

       Ảnh sản phẩm chỉ xuất hiện 1 lần.
       A/B đều sử dụng cùng ảnh này.
       ================================================== */

    .product-image {
      display: flex;

      align-items: center;
      justify-content: center;

      min-height: 500px;

      background-color: #f3f3f3;

      border-radius: 15px;

      overflow: hidden;
    }


    .product-image img {
      width: 100%;

      max-width: 470px;

      height: auto;

      object-fit: contain;

      display: block;
    }


    /* ==================================================
       PRODUCT INFORMATION
       ================================================== */

    .product-info {
      display: flex;

      flex-direction: column;

      justify-content: center;
    }


    .product-category {
      display: inline-block;

      width: fit-content;

      margin-bottom: 16px;

      padding: 6px 12px;

      background-color: #111;

      color: #fff;

      border-radius: 20px;

      font-size: 12px;

      font-weight: 700;
    }


    .product-title {
      margin-bottom: 15px;

      font-size: 30px;

      font-weight: 800;

      line-height: 1.35;
    }


    .product-description {
      margin-bottom: 25px;

      font-size: 14px;

      color: #666;

      line-height: 1.8;
    }


    /* ==================================================
       PRICE
       ================================================== */

    .price-box {
      margin-bottom: 25px;

      padding: 20px 0;

      border-top: 1px solid #eee;

      border-bottom: 1px solid #eee;
    }


    .price-label {
      margin-bottom: 5px;

      font-size: 12px;

      color: #999;
    }


    .price {
      font-size: 30px;

      font-weight: 800;
    }


    .currency {
      font-size: 16px;

      font-weight: 600;
    }


    /* ==================================================
       CTA BUTTON

       Đây là element quan trọng để VWO theo dõi Click Goal.

       A안:
       구매하기

       B안 sẽ được sửa trực tiếp trên VWO Visual Editor.
       ================================================== */

    #test-button {
      width: 100%;

      padding: 17px 20px;

      border: none;

      border-radius: 10px;

      background-color: #111;

      color: #fff;

      font-size: 17px;

      font-weight: 700;

      cursor: pointer;

      transition: 0.2s ease;
    }


    #test-button:hover {
      background-color: #333;

      transform: translateY(-1px);
    }


    /* ==================================================
       SMALL INFORMATION
       ================================================== */

    .purchase-info {
      display: flex;

      justify-content: space-between;

      margin-top: 15px;

      font-size: 12px;

      color: #888;
    }


    /* ==================================================
       FOOTER
       ================================================== */

    footer {
      margin-top: 60px;

      padding: 30px 20px;

      background-color: #111;

      color: #aaa;

      text-align: center;

      font-size: 12px;

      line-height: 1.8;
    }


    /* ==================================================
       MOBILE
       ================================================== */

    @media (max-width: 768px) {

      header {
        padding: 0 20px;
      }


      main {
        margin: 25px auto;
      }


      .product-card {
        grid-template-columns: 1fr;

        gap: 30px;

        padding: 25px;
      }


      .product-image {
        min-height: 350px;
      }


      .product-title {
        font-size: 25px;
      }


      .purchase-info {
        flex-direction: column;

        gap: 5px;
      }

    }

  </style>

</head>


<body>


  <!-- ==================================================
       HEADER
       ================================================== -->

  <header>

    <div class="logo">
      LABUBU STORE
    </div>

    <div class="header-right">
      Official Collection
    </div>

  </header>



  <!-- ==================================================
       MAIN
       ================================================== -->

  <main>


    <div class="breadcrumb">
      HOME &nbsp;›&nbsp; LABUBU &nbsp;›&nbsp; PRODUCT
    </div>



    <!-- ==================================================
         PRODUCT CARD
         ================================================== -->

    <section class="product-card">


      <!-- ==================================================
           PRODUCT IMAGE

           ↓ 여기의 파일 이름만 변경하면 됩니다.

           예:
           labubu.jpg
           labubu.png
           product-image.webp
           ================================================== -->

      <div class="product-image">

        <img
          src="product-image.jpg"
          alt="Labubu The Monsters"
        >

      </div>



      <!-- ==================================================
           PRODUCT INFORMATION
           ================================================== -->

      <div class="product-info">


        <span class="product-category">
          LABUBU COLLECTION
        </span>



        <h1 class="product-title">
          LABUBU The Monsters
          Special Collection
        </h1>



        <p class="product-description">
          귀여운 디자인과 독특한 캐릭터로 많은 사랑을 받고 있는
          Labubu 컬렉션 상품입니다.
          소장 가치가 높은 인기 상품을 만나보세요.
        </p>



        <!-- ==================================================
             PRICE

             A/B 동일하게 유지
             ================================================== -->

        <div class="price-box">

          <div class="price-label">
            판매 가격
          </div>

          <div class="price">
            32,000
            <span class="currency">KRW</span>
          </div>

        </div>



        <!-- ==================================================
             CTA BUTTON

             A안(Control)

             VWO에서 B안으로 변경:
             "사은품 받고 구매하기"

             ※ 여기서는 변경하지 않음.
             ================================================== -->

        <button
          id="test-button"
          type="button"
        >
          구매하기
        </button>



        <div class="purchase-info">

          <span>✓ 정품 상품</span>

          <span>✓ 안전한 결제</span>

          <span>✓ 글로벌 배송</span>

        </div>


      </div>

    </section>


  </main>



  <!-- ==================================================
       FOOTER
       ================================================== -->

  <footer>

    <p>
      LABUBU STORE
    </p>

    <p>
      본 페이지는 온라인 A/B 테스트 연구를 위한
      가상 쇼핑몰 페이지입니다.
    </p>

  </footer>


</body>
</html>
